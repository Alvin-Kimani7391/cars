<!DOCTYPE html>
<html>
<head>
  <title>Upload Product</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; padding: 30px; }

    .box {
      background: white;
      padding: 24px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background: black;
      color: white;
      padding: 13px;
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 15px;
      margin-top: 8px;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }

    #msg.success {
      background: #e6ffed;
      color: #1a7f37;
      display: block;
    }

    #msg.error {
      background: #fff0f0;
      color: #cc0000;
      display: block;
    }

    .preview {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Upload Product</h2>

  <input id="make" placeholder="Make (e.g. Toyota)" />
  <input id="model" placeholder="Model (e.g. Land Cruiser)" />
  <input id="category" placeholder="Category (e.g. SUV, Sedan)" />
  <input id="year" type="number" placeholder="Year (e.g. 2022)" />
  <input id="color" placeholder="Color" />
  <input id="price" type="number" placeholder="Price (KES)" />
  <input id="oldPrice" type="number" placeholder="Old Price (optional)" />

  <textarea id="description" rows="3" placeholder="Description"></textarea>

  <input type="file" id="images" multiple accept="image/*" onchange="previewImages()" />
  <div class="preview" id="preview"></div>

  <button id="btn" onclick="uploadProduct()">Upload Product</button>

  <p id="msg"></p>
</div>

<script>
const API = "https://cars3-158h.onrender.com";

function previewImages() {
  const preview = document.getElementById("preview");
  preview.innerHTML = "";
  const files = document.getElementById("images").files;

  for (const file of files) {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  }
}

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = type;
}

async function uploadProduct() {
  const btn = document.getElementById("btn");

  const make        = document.getElementById("make").value.trim();
  const model       = document.getElementById("model").value.trim();
  const category    = document.getElementById("category").value.trim();
  const description = document.getElementById("description").value.trim();
  const price       = document.getElementById("price").value.trim();
  const files       = document.getElementById("images").files;

  if (!make)        return showMsg("Make is required", "error");
  if (!category)    return showMsg("Category is required", "error");
  if (!description) return showMsg("Description is required", "error");
  if (!price)       return showMsg("Price is required", "error");
  if (files.length === 0) return showMsg("Please select at least one image", "error");

  const formData = new FormData();
  formData.append("make", make);
  formData.append("model", model);
  formData.append("category", category);
  formData.append("year", document.getElementById("year").value.trim());
  formData.append("color", document.getElementById("color").value.trim());
  formData.append("price", price);
  formData.append("oldPrice", document.getElementById("oldPrice").value.trim());
  formData.append("description", description);

  for (const file of files) {
    formData.append("images", file);
  }

  btn.disabled = true;
  btn.textContent = "Uploading...";
  showMsg("", "");

  try {
    const res = await fetch(`${API}/api/products`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (res.ok) {
      showMsg(`✅ ${data.message || "Uploaded successfully!"}`, "success");
      document.querySelectorAll("input, textarea").forEach(el => el.value = "");
      document.getElementById("preview").innerHTML = "";
    } else {
      showMsg(`❌ ${data.error || "Upload failed"}`, "error");
    }

  } catch (err) {
    console.error(err);
    showMsg("❌ Network error", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Upload Product";
  }
}
</script>

</body>
</html>
