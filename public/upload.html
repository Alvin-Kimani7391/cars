<!DOCTYPE html>
<html>
<head>
  <title>Upload Product</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 30px;
    }

    .box {
      background: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    button {
      background: black;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Upload Product</h2>

  <input id="make" placeholder="Make (Toyota, BMW)" />
  <input id="model" placeholder="Model" />
  <input id="category" placeholder="Category (SUV, Sedan)" />
  <input id="year" type="number" placeholder="Year" />
  <input id="color" placeholder="Color" />

  <input id="price" type="number" placeholder="Price" />
  <input id="oldPrice" type="number" placeholder="Old Price (optional)" />

  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="images" multiple />

  <button onclick="uploadProduct()">Upload</button>

  <p id="msg"></p>
</div>

<script>
async function uploadProduct() {
  const formData = new FormData();

  formData.append("make", document.getElementById("make").value);
  formData.append("model", document.getElementById("model").value);
  formData.append("category", document.getElementById("category").value);
  formData.append("year", document.getElementById("year").value);
  formData.append("color", document.getElementById("color").value);
  formData.append("price", document.getElementById("price").value);
  formData.append("oldPrice", document.getElementById("oldPrice").value);
  formData.append("description", document.getElementById("description").value);

  const files = document.getElementById("images").files;

  for (let i = 0; i < files.length; i++) {
    formData.append("images", files[i]);
  }

  try {
    const res = await fetch("https://cars3-158h.onrender.com/api/products", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    document.getElementById("msg").innerText = data.message || "Uploaded!";
  } catch (err) {
    console.error(err);
    document.getElementById("msg").innerText = "Upload failed";
  }
}
</script>

</body>
</html>
